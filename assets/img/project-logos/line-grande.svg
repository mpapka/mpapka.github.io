<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <!-- central compute hub -->
  <polygon points="400,150 452,180 452,240 400,270 348,240 348,180" stroke-width="5"/>
  <circle cx="400" cy="210" r="6" fill="#111111" stroke="none"/>

  <!-- edge sensor node -->
  <line x1="180" y1="360" x2="180" y2="230"/>
  <rect x="164" y="200" width="32" height="30" rx="4"/>
  <path d="M150,190 C165,175 195,175 210,190" stroke-width="3.5"/>
  <path d="M138,178 C160,155 200,155 222,178" stroke-width="3.5" opacity="0.6"/>

  <!-- second, smaller edge sensor -->
  <line x1="610" y1="370" x2="610" y2="270"/>
  <rect x="596" y="246" width="28" height="26" rx="4"/>
  <path d="M584,238 C596,225 624,225 636,238" stroke-width="3.5"/>

  <!-- links from sensors to the hub -->
  <line x1="196" y1="215" x2="352" y2="195" stroke-width="3.5" opacity="0.7"/>
  <line x1="600" y1="258" x2="448" y2="215" stroke-width="3.5" opacity="0.7"/>

  <!-- ground / horizon -->
  <line x1="90" y1="392" x2="710" y2="392" stroke-width="3.5" opacity="0.4"/>
</svg>
