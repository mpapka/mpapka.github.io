  <rect x="180" y="90" width="440" height="270" rx="14"/>
  <line x1="360" y1="360" x2="360" y2="392"/>
  <line x1="440" y1="360" x2="440" y2="392"/>
  <line x1="320" y1="392" x2="480" y2="392"/>

  <!-- waveform / chart inside the screen -->
