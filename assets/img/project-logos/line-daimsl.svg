<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <!-- mirror line separating the physical arm from its digital twin -->
  <line x1="400" y1="60" x2="400" y2="390" stroke-dasharray="4 10" stroke-width="3.5" opacity="0.6"/>

  <!-- physical robotic arm (left) -->
  <circle cx="230" cy="360" r="24"/>
  <line x1="230" y1="336" x2="230" y2="300"/>
  <line x1="230" y1="300" x2="150" y2="230"/>
  <circle cx="150" cy="230" r="7" fill="#111111" stroke="none"/>
  <line x1="150" y1="230" x2="220" y2="150"/>
  <circle cx="220" cy="150" r="7" fill="#111111" stroke="none"/>
  <line x1="220" y1="150" x2="290" y2="120"/>
  <line x1="278" y1="98" x2="290" y2="120"/>
  <line x1="290" y1="120" x2="316" y2="108"/>

  <!-- digital twin (right), same pose, dashed to read as virtual -->
  <g stroke-dasharray="6 8" opacity="0.85">
    <circle cx="570" cy="360" r="24"/>
    <line x1="570" y1="336" x2="570" y2="300"/>
    <line x1="570" y1="300" x2="650" y2="230"/>
    <line x1="650" y1="230" x2="580" y2="150"/>
    <line x1="580" y1="150" x2="510" y2="120"/>
    <line x1="498" y1="98" x2="510" y2="120"/>
    <line x1="510" y1="120" x2="484" y2="108"/>
  </g>
  <circle cx="650" cy="230" r="7" fill="#111111" stroke="none"/>
  <circle cx="580" cy="150" r="7" fill="#111111" stroke="none"/>
</svg>
